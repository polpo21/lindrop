# lindrop - AirDrop from the bar and a control-center panel. A headless
# [[service]] owns the truth: it polls the user unit lindrop-ricevi.service,
# publishes "status", runs sends (publishing "send"), and acts on "command".
# The bar [[widget]], the control-center [[shortcut]] tile and the [[panel]]
# are thin clients over that shared state.
#
# Widget:   left = receive on/off, right = open the management panel.
# Tile:     click = open the panel, right = receive on/off.
# Panel:    receive toggle, "Invia file…" (zenity picker → lindrop invia),
#           open the received-files folder.

id = "polpo/lindrop"
name = "lindrop"
version = "0.2.0"
plugin_api = 24
author = "polpo"
license = "GPL-3.0-or-later"
dependencies = ["lindrop", "zenity"]
tags = ["airdrop", "iphone", "sharing"]
icon = "access-point"
description = "AirDrop tra iPhone e Linux: ricevi dalla barra e invia dal centro di controllo."

[[service]]
id = "service"
entry = "servizio.luau"

[[widget]]
id = "airdrop"
entry = "widget.luau"

  [widget.actions]
  middle = "none"

[[shortcut]]
id = "ricezione"
entry = "riquadro.luau"

[[panel]]
id = "gestione"
entry = "pannello.luau"
width = 340
height = 320
placement = "attached"
position = "auto"
open_near_click = true
