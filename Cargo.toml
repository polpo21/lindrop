[package]
name = "lindrop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "AirDrop between iPhone and Linux, written from scratch in Rust"
license = "GPL-3.0-or-later"
repository = "https://github.com/polpo21/lindrop"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
libc = "0.2.191"
plist = "1.10.1"
rcgen = "0.14.10"
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simple-dns = "0.12.0"
socket2 = "0.6.5"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
